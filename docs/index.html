<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fintech Tech Course calendar</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --card:#fff; --line:#e7e5e4; --accent:#0f766e; --accent-fg:#fff; --cap:#fef3c7; --cp:#e0f2fe; --fin:#dcfce7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#2dd4bf; --accent-fg:#042f2e; --cap:#422006; --cp:#082f49; --fin:#052e16; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:1.6rem; margin:0; }
  p.lead { color:var(--muted); margin:8px 0 24px; }
  .lang button { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; cursor:pointer; font:inherit; }
  .lang button:first-child { border-radius:8px 0 0 8px; } .lang button:last-child { border-radius:0 8px 8px 0; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:.9rem; }
  label small { font-weight:400; color:var(--muted); }
  input, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .full { grid-column:1 / -1; }
  .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .primary { background:var(--accent); color:var(--accent-fg); border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  #summary { color:var(--muted); }
  #error { color:#dc2626; }
  h2 { font-size:1.15rem; margin:32px 0 8px; }
  ol.steps li { margin-bottom:6px; }
  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  table { border-collapse:collapse; width:100%; font-size:.9rem; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { position:sticky; top:0; background:var(--card); }
  td.date { white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr.capstone td { background:var(--cap); }
  tr.checkpoint td { background:var(--cp); }
  tr.final td { background:var(--fin); }
  tr.session { cursor:pointer; }
  tr.session:hover td { filter:brightness(.97); }
  tr.session td.toggle { width:28px; text-align:center; color:var(--muted); transition:transform .15s; }
  tr.session[aria-expanded="true"] td.toggle span { display:inline-block; transform:rotate(90deg); }
  tr.detail td { background:var(--bg); padding:12px 20px 16px; font-size:.9rem; line-height:1.6; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre { margin:0 0 10px; }
  .md h4 { margin:16px 0 6px; font-size:.9rem; font-weight:700; }
  .md ul, .md ol { padding-left:22px; } .md li { margin:3px 0; }
  .md blockquote { border-left:3px solid #d97706; background:var(--cap); padding:8px 12px; border-radius:0 8px 8px 0; }
  .md code { font:.84em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--line); padding:1px 5px; border-radius:4px; white-space:nowrap; }
  .md pre { background:var(--line); padding:10px 12px; border-radius:8px; overflow-x:auto; }
  .md pre code { background:none; padding:0; white-space:pre; }
  tr.detail[hidden] { display:none; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 12px; padding:0; list-style:none; font-size:.85rem; color:var(--muted); }
  .legend li { display:flex; align-items:center; gap:6px; }
  .legend i { width:14px; height:14px; border-radius:4px; border:1px solid var(--line); display:inline-block; }
  td.check { width:36px; text-align:center; }
  td.check input { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; margin:0; }
  tr.session.done td:not(.check):not(.toggle) { color:var(--muted); text-decoration:line-through; }
  .progress { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:0 0 12px; }
  .progress-top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; font-size:.9rem; }
  .progress-top strong { font-size:1rem; }
  .bar { height:10px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .25s; }
  .linklike { background:none; border:0; padding:0; color:var(--muted); font:inherit; font-size:.8rem; text-decoration:underline; cursor:pointer; }
  .hint { font-size:.85rem; color:var(--muted); margin:0 0 8px; }
  footer { margin-top:32px; color:var(--muted); font-size:.85rem; }
  a { color:var(--accent); }
  @media (max-width:600px) { form { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">English</button><button type="button" data-lang="pt-BR">Português</button>
    </div>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <form id="form">
    <label><span data-i18n="start"></span><input type="date" id="start" required><small data-i18n="startHint"></small></label>
    <label><span data-i18n="time"></span><input type="time" id="time" value="19:00" required><small data-i18n="timeHint"></small></label>
    <label class="full"><span data-i18n="skip"></span><textarea id="skip" rows="2" placeholder="2027-04-02, 2027-04-21"></textarea><small data-i18n="skipHint"></small></label>
    <label class="full"><span data-i18n="name"></span><input type="text" id="name" value="Fintech Tech Course"></label>
    <div class="full actions">
      <button class="primary" type="submit" data-i18n="download"></button>
      <span id="summary"></span><span id="error"></span>
    </div>
  </form>

  <h2 data-i18n="howTitle"></h2>
  <ol class="steps">
    <li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li>
  </ol>

  <h2 data-i18n="previewTitle"></h2>
  <ul class="legend">
    <li><i style="background:var(--card)"></i><span data-i18n="lgStudy"></span></li>
    <li><i style="background:var(--cap)"></i><span data-i18n="lgCap"></span></li>
    <li><i style="background:var(--cp)"></i><span data-i18n="lgCp"></span></li>
    <li><i style="background:var(--fin)"></i><span data-i18n="lgFin"></span></li>
  </ul>
  <div class="progress">
    <div class="progress-top"><strong id="progressText"></strong><button type="button" class="linklike" id="reset" data-i18n="reset"></button></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div id="barFill"></div></div>
  </div>
  <p class="hint" data-i18n="hint"></p>
  <div class="table-wrap"><table><thead><tr><th aria-hidden="true"></th><th data-i18n="colDone"></th><th data-i18n="colDate"></th><th data-i18n="colWeek"></th><th data-i18n="colSession"></th></tr></thead><tbody id="preview"></tbody></table></div>

  <footer data-i18n="footer"></footer>
</main>

<script type="module">
import { buildIcs, schedule } from "./ics.js";

const STR = {
  en: {
    title: "Fintech Tech Course: your calendar",
    lead: "13 weeks, weekdays only: 3 h 30 Monday to Wednesday (with 30 min of DSA), 3 h Thursday and Friday. Pick when you start and download every session as a calendar file.",
    start: "Start date", startHint: "Use a Monday so capstone days fall on Thursday and Friday.",
    time: "Start time", timeHint: "Sessions last 3 h 30 Monday to Wednesday and 3 h Thursday and Friday, in your calendar's time zone.",
    skip: "Days off", skipHint: "Holidays or vacation, as YYYY-MM-DD separated by commas or new lines. Sessions on those days move to the next weekday.",
    name: "Calendar name",
    download: "Download .ics",
    summary: (n, a, b) => `${n} sessions, from ${a} to ${b}.`,
    howTitle: "How to import",
    how1: "Google Calendar: create a dedicated calendar first (Settings, Add calendar, Create new calendar), so you can hide or delete the course in one click.",
    how2: "Then open Settings, Import & export, choose the downloaded file and select that calendar.",
    how3: "Apple Calendar and Outlook: open the .ics file and pick or create a calendar when asked.",
    previewTitle: "Preview", colDate: "Date", colWeek: "Week", colSession: "Session",
    lgStudy: "Study day: DSA + reading + lab", lgCap: "Capstone day: implementation, no AI", lgCp: "Checkpoint: review and catch-up", lgFin: "Final project",
    hint: "Click a day to see what to do in that session. Tick the box when you finish it; progress is saved in this browser.",
    colDone: "Done", reset: "Clear progress", resetConfirm: "Clear all completed sessions in this browser?",
    progress: (d, n, p) => `${d} of ${n} sessions done (${p}%)`,
    footer: 'Syllabus, modules and the "no AI on capstone days" rule: <a href="https://github.com/guiferpa/fintech-tech-course">github.com/guiferpa/fintech-tech-course</a>. Everything runs in your browser; nothing is sent anywhere.',
    locale: "en-US",
  },
  "pt-BR": {
    title: "Fintech Tech Course: sua agenda",
    lead: "13 semanas, só dias úteis: 3 h 30 de segunda a quarta (com 30 min de DSA) e 3 h na quinta e na sexta. Escolha quando começar e baixe todas as sessões como arquivo de calendário.",
    start: "Data de início", startHint: "Use uma segunda-feira para os dias de conclusão caírem na quinta e na sexta.",
    time: "Horário de início", timeHint: "As sessões duram 3 h 30 de segunda a quarta e 3 h na quinta e na sexta, no fuso do seu calendário.",
    skip: "Dias de folga", skipHint: "Feriados ou férias, no formato AAAA-MM-DD separados por vírgula ou linha. As sessões desses dias passam para o próximo dia útil.",
    name: "Nome do calendário",
    download: "Baixar .ics",
    summary: (n, a, b) => `${n} sessões, de ${a} a ${b}.`,
    howTitle: "Como importar",
    how1: "Google Agenda: crie antes um calendário dedicado (Configurações, Adicionar agenda, Criar nova agenda), assim você oculta ou apaga o curso com um clique.",
    how2: "Depois abra Configurações, Importar e exportar, escolha o arquivo baixado e selecione esse calendário.",
    how3: "Apple Calendário e Outlook: abra o arquivo .ics e escolha ou crie um calendário quando pedir.",
    previewTitle: "Prévia", colDate: "Data", colWeek: "Semana", colSession: "Sessão",
    lgStudy: "Dia de estudo: DSA + leitura + laboratório", lgCap: "Dia de conclusão: implementação, sem IA", lgCp: "Checkpoint: revisão e recuperação", lgFin: "Projeto final",
    hint: "Clique em um dia para ver o que fazer naquela sessão. Marque a caixa quando terminar; o progresso fica salvo neste navegador.",
    colDone: "Feito", reset: "Limpar progresso", resetConfirm: "Limpar todas as sessões concluídas neste navegador?",
    progress: (d, n, p) => `${d} de ${n} sessões concluídas (${p}%)`,
    footer: 'Ementa, módulos e a regra "sem IA nos dias de conclusão": <a href="https://github.com/guiferpa/fintech-tech-course">github.com/guiferpa/fintech-tech-course</a>. Tudo roda no seu navegador; nada é enviado.',
    locale: "pt-BR",
  },
};

const $ = (id) => document.getElementById(id);
let data, lang = "en";
try { const saved = localStorage.getItem("ftc-lang"); if (saved in STR) lang = saved; else if (navigator.language?.startsWith("pt")) lang = "pt-BR"; } catch {}

function nextMonday() {
  const d = new Date(); d.setHours(12);
  d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const skipList = () => $("skip").value.split(/[\s,;]+/).map((s) => s.trim()).filter(Boolean);
const fmt = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(STR[lang].locale, { weekday: "short", day: "2-digit", month: "short", year: "numeric" });

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// Progress is keyed by session position (1-65), so it survives changes to the start date or days off.
const DONE_KEY = "ftc-done";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]")); } catch {}
function saveDone() { try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch {} }
function renderProgress() {
  if (!data) return;
  const n = data.sessions.length, d = [...done].filter((i) => i >= 1 && i <= n).length, pct = Math.round((d / n) * 100);
  $("progressText").textContent = STR[lang].progress(d, n, pct);
  $("barFill").style.width = pct + "%";
  $("bar").setAttribute("aria-valuenow", String(pct));
}

// Minimal Markdown for session details: #### headings, > quotes, - and 1. lists,
// ``` fenced code, `code`, **bold** and [links](url). Input is escaped first.
function mdInline(t) {
  const codes = [];
  t = esc(t).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const out = [], lines = src.split("\n");
  let list = null, para = [];
  const flushPara = () => { if (para.length) out.push(`<p>${para.join("<br>")}</p>`); para = []; };
  const closeList = () => { if (list) out.push(`</${list}>`); list = null; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (line.startsWith("```")) {
      flushPara(); closeList();
      const code = [];
      while (++i < lines.length && !lines[i].startsWith("```")) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (!line.trim()) { flushPara(); closeList(); }
    else if ((m = /^#{1,6} (.*)/.exec(line))) { flushPara(); closeList(); out.push(`<h4>${mdInline(m[1])}</h4>`); }
    else if ((m = /^> ?(.*)/.exec(line))) { flushPara(); closeList(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`); }
    else if ((m = /^(?:- (.*)|(\d+)\. (.*))$/.exec(line))) {
      flushPara();
      const type = m[1] !== undefined ? "ul" : "ol";
      if (list !== type) { closeList(); out.push(type === "ol" && m[2] !== "1" ? `<ol start="${m[2]}">` : `<${type}>`); list = type; }
      out.push(`<li>${mdInline(m[1] ?? m[3])}</li>`);
    } else { closeList(); para.push(mdInline(line)); }
  }
  flushPara(); closeList();
  return out.join("");
}

function toggleRow(tr) {
  const open = tr.getAttribute("aria-expanded") !== "true";
  tr.setAttribute("aria-expanded", String(open));
  tr.nextElementSibling.hidden = !open;
}

function render() {
  const t = STR[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { const v = t[el.dataset.i18n]; if (typeof v === "string") el.innerHTML = v; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (!data) return;
  $("error").textContent = "";
  try {
    const rows = schedule(data.sessions, { start: $("start").value, skip: skipList() });
    $("summary").textContent = t.summary(rows.length, fmt(rows[0].date), fmt(rows.at(-1).date));
    $("preview").innerHTML = rows.map((s, i) => {
      const cls = s.module === "C1" || s.module === "C2" ? "checkpoint" : s.module === "F" ? "final" : s.day >= 4 ? "capstone" : "";
      const n = i + 1, isDone = done.has(n);
      return `<tr class="session ${cls}${isDone ? " done" : ""}" tabindex="0" aria-expanded="false" data-n="${n}"><td class="toggle"><span>&#9656;</span></td><td class="check"><input type="checkbox" aria-label="${esc(s.title[lang])}"${isDone ? " checked" : ""}></td><td class="date">${fmt(s.date)}</td><td>${s.week}</td><td>${esc(s.title[lang])}</td></tr>`
        + `<tr class="detail" hidden><td colspan="5" class="md">${md((s.details || s.description)[lang])}</td></tr>`;
    }).join("");
    renderProgress();
  } catch (e) { $("summary").textContent = ""; $("error").textContent = e.message; }
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("ftc-lang", lang); } catch {} render();
}));
$("preview").addEventListener("click", (e) => { const tr = e.target.closest("tr.session"); if (tr && !e.target.closest("a, td.check")) toggleRow(tr); });
$("preview").addEventListener("change", (e) => {
  if (!e.target.matches("td.check input")) return;
  const tr = e.target.closest("tr.session"), n = Number(tr.dataset.n);
  e.target.checked ? done.add(n) : done.delete(n);
  tr.classList.toggle("done", e.target.checked);
  saveDone(); renderProgress();
});
$("reset").addEventListener("click", () => {
  if (!confirm(STR[lang].resetConfirm)) return;
  done.clear(); saveDone(); render();
});
$("preview").addEventListener("keydown", (e) => { const tr = e.target.closest("tr.session"); if (tr && e.target === tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleRow(tr); } });
["start", "skip"].forEach((id) => $(id).addEventListener("input", render));

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  try {
    const ics = buildIcs(data, { start: $("start").value, time: $("time").value, lang, skip: skipList(), calendarName: $("name").value.trim() });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([ics], { type: "text/calendar" })), download: `fintech-tech-course-${$("start").value}.ics` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (err) { $("error").textContent = err.message; }
});

$("start").value = nextMonday();
render();
fetch("./sessions.json").then((r) => r.json()).then((d) => { data = d; render(); }).catch((e) => { $("error").textContent = e.message; });
</script>
</body>
</html>
